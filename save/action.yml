name: Save artifact on the runner
description: Saves files on the self-hosted runner's machine for later jobs of this run. A stand-in for actions/upload-artifact.

inputs:
  name:
    description: Name to load the files by
    required: true
  path:
    description: Files to save, one pattern per line, relative to the checkout. Folders save everything in them.
    required: true
  if-no-files-found:
    description: "'error' to fail when nothing matches, 'ignore' to save nothing"
    default: error
  retention-days:
    description: Runs of this repository older than this are deleted when saving
    default: "2"
  dir:
    description: Folder on the machine that holds the saved files
    default: ~/self-hosted-artifacts

runs:
  using: composite
  steps:
    - shell: bash
      env:
        NAME: ${{ inputs.name }}
        ARTIFACT_PATH: ${{ inputs.path }}
        IF_NO_FILES_FOUND: ${{ inputs.if-no-files-found }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
        ARTIFACTS_DIR: ${{ inputs.dir }}
      run: python3 "$GITHUB_ACTION_PATH/../artifacts.py" save "$NAME"
